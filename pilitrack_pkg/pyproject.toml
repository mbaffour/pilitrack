[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pilitrack"
version = "0.1.0"
description = "Quantify type IV pili dynamics from labelled time-lapse microscopy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "pandas>=2.0",
]

[project.scripts]
pilitrack-gui = "pilitrack.app:main"
pilitrack-batch = "pilitrack.batch:main"
pilitrack-validate = "pilitrack.validate:main"
pilitrack-prelabel = "pilitrack.annotate:prelabel_main"
pilitrack-web = "pilitrack.web_launch:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
io = ["nd2>=0.10", "tifffile>=2023.7"]  # read real ND2 (and TIFF) movies
czi = ["czifile"]                       # read Zeiss CZI (or install aicsimageio)
qc = ["matplotlib>=3.7"]                # QC overlay PNGs + figures
web = ["streamlit>=1.30", "streamlit-image-coordinates>=0.4", "matplotlib>=3.7"]  # browser app
viewer = ["napari[all]>=0.5", "magicgui>=0.7"]  # desktop GUI + hand-labeling
yaml = ["pyyaml"]                       # optional YAML config files
# Optional detection backends (heavy / not hard dependencies):
ml = ["scikit-learn>=1.1", "joblib"]  # trainable pilus detector (pilitrack.ml)
cellpose = ["cellpose"]        # deep-learning cell instance segmentation (recommended)
omnipose = ["omnipose"]        # alternative instance segmentation
ilastik = ["h5py"]             # read ilastik headless probability exports
#   (ilastik itself is a standalone app from ilastik.org, not a pip package)
# EVERYTHING needed to run the full tool on real data (both GUIs). Heavy ML
# backends (cellpose/omnipose) stay separate — add them if you need instance
# segmentation of touching cells.
all = [
    "nd2>=0.10", "tifffile>=2023.7", "matplotlib>=3.7",
    "streamlit>=1.30", "streamlit-image-coordinates>=0.4",
    "napari[all]>=0.5", "magicgui>=0.7", "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
